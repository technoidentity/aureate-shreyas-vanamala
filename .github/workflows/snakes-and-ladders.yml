name: Snakes and Ladders CI

on:
  push:
    branches: [Shreyas]
  pull_request:
    branches: [Shreyas, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-packages:
    name: Check ${{ matrix.manifest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - hallo_cargo/Cargo.toml
          - Rust_practice/Cargo.toml
          - Rust_practice/Rust_Programs/Cargo.toml
          - Rust_practice/Rust_Programs/snakes_and_ladders/Cargo.toml
    steps:
      - name: Download repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check all package targets
        run: cargo check --locked --all-targets --manifest-path "${{ matrix.manifest }}"

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: Rust_practice/Rust_Programs/snakes_and_ladders
        run: cargo fmt --check

      - name: Build release game
        working-directory: Rust_practice/Rust_Programs/snakes_and_ladders
        run: cargo build --release --locked

      - name: Run tests
        working-directory: Rust_practice/Rust_Programs/snakes_and_ladders
        run: cargo test --locked

      - name: Upload game artifact
        uses: actions/upload-artifact@v4
        with:
          name: snakes-and-ladders-linux
          path: Rust_practice/Rust_Programs/snakes_and_ladders/target/release/snake_and_ladders_graphical
          if-no-files-found: error
          retention-days: 7
